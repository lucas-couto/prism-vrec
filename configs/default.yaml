# =============================================================================
# General configuration
# =============================================================================
# Seed used for every random source (NumPy, Python random, PyTorch).  The
# grid-search worker derives one deterministic seed per job from this value
# plus the job identity (dataset, model, embedding, hyperparams).
seed: 42

# "auto" picks cuda when a GPU is visible, otherwise cpu.  "cuda" and
# "cpu" force a specific device; "cuda" still falls back to cpu with a
# warning if no GPU is detected, so a misconfigured host does not
# silently crash.  The resolved device is recorded in the run manifest.
device: "auto"

# When true the extract step also writes the pre-pool component
# embeddings (`<extractor>_comp.npy`, shape (n_items, M, native_dim))
# for extractors that expose them.  Leave false: component extraction
# is AUTO-ENABLED whenever a recommender in `recommenders_enabled`
# declares `requires_components` (e.g. acf), so this flag only needs
# to be true to force the artifacts with no such recommender enabled.
extract_components: false

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  embeddings: "data/embeddings"
  checkpoints: "checkpoints"
  results: "results"

datasets:
  - "amazon_fashion"
  - "amazon_women"
  - "amazon_men"
  - "tradesy"

# Per-dataset contract declaring whether the dataset is EXPECTED to ship
# item category labels.  Category presence is otherwise auto-detected from
# the raw data, and that silent decision controls two critical behaviours:
# (a) whether DeepStyle degenerates into VBPR (expected on category-less
# Tradesy) and (b) whether fine-tuning falls back to transfer weights.
# Declaring the expectation here turns a silent content-driven flip into a
# loud contract violation: preprocessing raises if the data disagrees.
#   true  → amazon_* carry a per-item category (one-hot ``c`` or McAuley
#           taxonomy), so DeepStyle is expected to differ from VBPR.
#   false → Tradesy has no category, so DeepStyle must degenerate to VBPR
#           and fine-tuning must transfer weights from another dataset.
dataset_contracts:
  amazon_fashion:
    expects_categories: true
  amazon_women:
    expects_categories: true
  amazon_men:
    expects_categories: true
  tradesy:
    expects_categories: false

# =============================================================================
# Pipeline orchestration (consumed by main.py)
# =============================================================================
# These values are the defaults used when ``python main.py`` is invoked
# without CLI flags (e.g. ``docker compose up -d --build``).  The CLI
# always wins when a flag is provided.
#
# Step order is fixed and lives in ``main.py``; the same names accepted
# here are accepted by ``--step`` / ``--from`` / ``--to``.
#
# Available step names:
#   download, preprocess, extract, finetune, evaluate_finetuning,
#   fuse, train, evaluate, beyond_accuracy, statistical, export_best
pipeline:
  # When true the entire pipeline runs end-to-end (Battery 1 + Battery 2).
  # Set to false to honour ``start_from`` / ``stop_at`` instead.
  run_all: true

  # First step to execute (inclusive).  Ignored when ``run_all`` is true.
  start_from: null

  # Last step to execute (inclusive).  Ignored when ``run_all`` is true.
  stop_at: null

  # Which condition to run for fuse / train / evaluate steps.
  # "frozen", "finetuned" or "both" (runs each twice in order).
  condition: "frozen"

# =============================================================================
# Per-step throughput and cost telemetry
# =============================================================================
# A background thread samples GPU utilisation / power / memory and CPU
# usage while the pipeline runs; every step and every cell records the
# min / max / mean of that window plus the integrated GPU energy into
# the run manifest.  Overhead is one thread at 1 Hz.
#
# GPU power requires NVML: install the `telemetry` extra
# (`pip install -e .[telemetry]`) for the in-process binding, otherwise
# the framework falls back to a long-lived `nvidia-smi` reader, and
# finally to torch (memory only, no energy).
# =============================================================================
# User-level K-fold cross-validation (python main.py --folds)
# =============================================================================
# Users are split into k mutually exclusive folds.  In fold i the fold's
# users leave the training set; the model trains on the other folds
# (train history only — no user's test item ever enters training) with
# the FROZEN hyperparameters (from the prior search, results/
# best_hyperparams.json, or from fixed config values under
# hp_search.strategy: fixed), the held-out users are folded in from their
# profile (train ∪ val) with every non-user parameter frozen, and are
# evaluated on their single target item (the test.csv held-out).  The K
# per-user artifacts are concatenated so the paired statistics keep the
# user as the unit.  Protocol precedent: Rendle et al. (2009, §6.2) —
# repeated splits, hyperparameters searched once and kept constant.
folds:
  enabled: false
  k: 10
  seed: 42 # partition seed; fold i runs under seed + i
  min_profile: 2 # users with a smaller profile are excluded (counted)
  fold_in:
    epochs: 5
    learning_rate: null # null = the cell's learning_rate
    batch_size: null # null = the cell's batch_size

telemetry:
  enabled: true
  sample_interval_seconds: 1.0
  # Set to true to also dump the raw per-sample series to
  # results/runs/<run_id>/telemetry_samples.jsonl for plotting.
  save_samples: true

# =============================================================================
# DataLoader sizing (optional)
# =============================================================================
# By default the framework picks num_workers, prefetch_factor and the
# re-extract batch_size from the host's CPU count and cgroup memory
# budget (see src/utils/dataloader.py and docs/observability.md).
#
# Uncomment any field below to pin a value instead of letting the
# autotune decide.  Pinned values win over the autotune; fields left
# commented fall through to the autotune.  The resolved values
# (autotuned or pinned) and any active overrides are recorded under
# ``manifest['dataloader_autotune']``.
#
dataloader:
  num_workers: 10
  prefetch_factor: 6
  batch_size: 192
