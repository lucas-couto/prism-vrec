# =============================================================================
# Evaluation and statistical reporting
# =============================================================================

# Ranking protocol used by the `evaluate` step (src/steps/evaluate.py).
#
# "full_ranking" (default, recommended) scores every item in the
# catalogue for every test user.  This is the thesis-grade primary
# protocol.
#
# "sampled" ranks each user's positives against ``n_negatives``
# random unseen items.  Much cheaper, but the resulting metrics are
# statistically inconsistent with full-ranking — the relative ordering
# of models can flip between the two protocols (Krichene & Rendle,
# "On Sampled Metrics for Item Recommendation", KDD 2020).  Use only
# for comparability with prior work that adopted the same protocol;
# never as the headline benchmark number.
evaluation:
  protocol: "full_ranking"
  n_negatives: 100
  negative_sampling_seed: 42

# Cut-off positions for the ranking metrics.
k_values: [5, 10, 20]

# Which metrics exist is NOT configurable (there is no `metrics:` list;
# one used to sit here and was read by nothing).  Per (user, model) pair:
#   evaluate         always writes precision, recall, f1, map, ndcg @k
#                    (src/evaluation/metrics.py); under leave-one-out
#                    recall = HitRate and precision / map are derived
#                    from it (see statistical.primary_metrics below).
#   beyond_accuracy  adds efd, efd_excluded_frac, ild, cat_entropy @k and
#                    the aggregate icov when `beyond_accuracy.enabled`.
# What enters the inferential tables is chosen by
# `statistical.primary_metrics` / `include_derived_metrics`.

# `beyond_accuracy` step (src/steps/beyond_accuracy.py) — POST-HOC
# beyond-accuracy metrics.
# Consumes the per-user top-20 artifacts persisted at final evaluation
# (results/per_user/) — it never re-ranks and never touches the
# Evaluator hot path — and merges efd@k / ild@k / cat_entropy@k into
# the same per-user tables as the accuracy metrics, for k_values <= 20.
#
#   efd@k         novelty (Mean Self-Information reduction of Vargas &
#                 Castells 2011, eq. 14); item popularity estimated on
#                 the TRAIN split only (no test leakage).
#   ild@k         visual diversity (Vargas & Castells 2011, eq. 16);
#                 cosine similarity normalised to [0,1] before the
#                 complement.  Computed in ONE fixed reference space
#                 for every system (see reference_embedding below).
#   cat_entropy@k Shannon entropy of top-k categories; only for
#                 datasets with expects_categories: true.  Tradesy is
#                 explicitly N/A (no column written).
#   icov@k        item coverage over the TRAIN catalogue.  AGGREGATE:
#                 one value per cell, replicated across its per-user
#                 rows and also written to
#                 {dataset}_beyond_accuracy_coverage.csv.  It has no
#                 per-user distribution — the `statistical` step refuses
#                 to include it in the per-user Wilcoxon/Friedman families.
#
# To run inference on the new metrics, add "efd" / "ild" /
# "cat_entropy" to statistical.primary_metrics below (they then flow
# through the same Wilcoxon/Holm families as recall/ndcg).
beyond_accuracy:
  enabled: true

  # PRE-REGISTERED METHODOLOGICAL DECISION: ILD is computed for EVERY
  # system in the native ResNet50 space
  # (data/embeddings/<dataset>/resnet50.npy), never in the evaluated
  # extractor's own space — "self-model" diversity is not comparable
  # across systems because each extractor deforms the space in its own
  # favour.  Missing artifact => the step fails loud.
  reference_embedding: "resnet50"

  # false (default): EFD in its Mean Self-Information form.
  # true: exponential rank discount (base 0.85, Vargas & Castells 2011
  # eq. 14); relevance weighting stays off (no post-hoc relevance
  # model under LOO).  Kept for future comparability with Deldjoo et
  # al. (2021).
  use_rank_relevance: false

# `statistical` step (src/steps/statistical.py) consumes the per-user
# metrics produced by `evaluate` / `beyond_accuracy` and writes one CSV
# per analysis under results/tables/.
statistical:
  # Family-wise significance level shared by every test below.
  alpha: 0.05

  # Multiple-comparison correction for pairwise Wilcoxon tests.
  # "holm"       — Holm-Bonferroni (default; uniformly more powerful)
  # "bonferroni" — vanilla Bonferroni (simpler, more conservative)
  # "none"       — uncorrected (do not use in published tables)
  correction: "holm"

  # Comparison families: the correction is applied WITHIN each family
  # (the set of hypotheses one research question defines), never over
  # the Cartesian product of every config — all-pairs Holm over ~77
  # configs runs with m ≈ 2900 and rejects everything artificially.
  # Each family varies exactly one experimental dimension:
  #   backbone_within_model — which backbone? (fixes the recommender)
  #   model_within_backbone — which recommender? (fixes the backbone)
  #   fusion_within_model   — which fusion? (fixes the recommender)
  #   frozen_vs_finetuned   — does fine-tuning help? (ONE instance per
  #                           dataset holding ALL frozen/finetuned pairs,
  #                           Holm with m = n_pairs; requires condition
  #                           "all")
  #   vs_baseline           — does visual signal beat pure BPR? (every
  #                           config vs bpr/none in one instance, Holm
  #                           with m = n_configs - 1)
  # "all_pairs" may be added for exploration but is never the default
  # for reported numbers. Every output row carries family, group and
  # n_comparisons_in_family so the correction is auditable.
  families:
    - backbone_within_model
    - model_within_backbone
    - fusion_within_model
    - frozen_vs_finetuned
    - vs_baseline

  # Metric families analysed by the `statistical` step. Under leave-one-out there are
  # only two independent signals per user — hit-or-not (recall@k, i.e.
  # HitRate@k) and hit rank (ndcg@k) — so these two are the primary
  # evidence. precision@k (= recall@k / k) and map@k (= 1/rank with a
  # single relevant item) are deterministic transforms of them; they
  # stay in the raw evaluation CSVs and are only analysed when
  # include_derived_metrics is true. Never read them as independent
  # confirmation of the primary metrics.
  primary_metrics: ["recall", "ndcg"]
  include_derived_metrics: false

  # Bootstrap confidence intervals: per-config mean (descriptive) and
  # the PAIRED mean-difference CI on every pairwise row (inferential —
  # the one that must agree with the Wilcoxon verdict; overlapping
  # per-config CIs do NOT contradict a significant paired test).
  bootstrap:
    enabled: true
    n_iterations: 1000

  # Friedman omnibus test, run WITHIN each comparison family (3+
  # configs). If a family's omnibus is not significant, none of its
  # pairwise effects can be claimed at the family level. Only the
  # one-dimension families have a meaningful K-way omnibus; for the
  # pair-collection families (vs_baseline, frozen_vs_finetuned) it is
  # undefined by construction and reported as NaN — their evidence is
  # the Holm-corrected pairwise tests alone.
  friedman:
    enabled: true

  # Cliff's delta (non-parametric, tie-robust) is the primary effect
  # size, consistent with Wilcoxon+pratt on 0/1-heavy LOO metrics.
  effect_size: true

  # Cohen's d is parametric and has no sensible interpretation on
  # zero-dominated paired differences (std shrinks, d inflates); it is
  # available for diagnostics only.
  include_cohens_d: false
