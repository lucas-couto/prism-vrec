# configs/resources.yaml — computational limits, researcher-controlled.
# Everything here is execution metadata: it changes how fast and how
# much memory a run uses, never what it computes.  The resolved block is
# recorded in the run manifest (manifest['resources']) and stays out of
# the scientific identity.  Resolved and validated once at startup by
# src/utils/resources.py; a missing file or block means the values
# below, and any negative, non-finite, boolean, non-integer, unknown or
# renamed key fails with a message naming it.
#
# Docker-level caps (mem_limit, cpus) stay in docker-compose.yml.
# A budget_bytes above the container's cgroup limit is logged as a
# WARNING at startup.
resources:
  gpu:
    # Fraction of the card the run may claim.  0.95 assumes the machine
    # runs unattended (overnight batteries); 0.5 is the desktop-friendly
    # value that keeps the compositor alive while someone works on the
    # same GPU (the code default when this block is absent).
    # PRISM_VRAM_SHARE=<fraction> overrides it for one launch.
    vram_share: 0.95
    ranking_vram_share: 0.125  # share of the cap one ranking batch may use (shorter kernels)
  host:
    budget_bytes: null         # null = read the cgroup limit; must not exceed PRISM_MEM_LIMIT
    headroom_bytes: 4294967296 # withheld from every pool (4 GiB)
    reserved_bytes: 4294967296 # parent process + page cache
  workers:
    training: 1                # replaces hp_search.workers (0 = auto-detect from VRAM)
    fusion: 1                  # replaces MAX_FUSION_WORKERS
    dataloader: 10             # auto | integer; clamped by the CPU quota
  dataloader:
    prefetch_factor: 6         # auto | integer; batches prefetched per DataLoader worker
    batch_size: 192            # auto | integer; the re-extract batch (finetune, evaluate_finetuning)
  features:
    # dense | lazy | auto.  `auto` since 2026-09-09: it keeps a feature
    # matrix resident while it fits the VRAM a worker gets, and reads
    # rows on demand when it does not, so the small cells stay fast and
    # the large ones stop dying on allocation.  `dense` is ~3x faster
    # per step but its peak grows with the feature width (measured on
    # ACF/amazon_men: 74 ms and 2.41 GB at D=128 against 113 ms and
    # 5.23 GB at D=768, while lazy holds ~2.2 GB at both); `lazy`
    # everywhere would pay that 3x on every cell that never needed it.
    # `auto` only sees the RESIDENT matrix — a peak that is transient in
    # the batch, as ACF's history staging, is not predicted here and is
    # recovered by the OOM retry, which escalates a failed job to lazy.
    # `lazy` since 2026-09-11 (researcher's decision), not `auto`.
    # ACF over a per-region component fusion stacks its sources at load:
    # resnet50_comp (5.3 GiB) + vit_b16_comp (2.0 GiB) in float32 is
    # 14.6 GiB against a 16 GiB cgroup, and the kill is a host-RAM
    # SIGKILL -- which takes the ORCHESTRATOR down with the job, so the
    # run cannot mark that cell failed and carry on.  Measured on
    # amazon_women: peak 14.6 GiB (killed) against 1.92 GiB with lazy,
    # and the admission planner's heaviest job drops 10.01 -> 3.40 GB.
    # `auto` cannot see this peak: it predicts the RESIDENT matrix in
    # VRAM, and the online stacking is host RAM.  The ~3x per-step cost
    # on the cells that never needed it is accepted: losing the whole
    # run to one cell is worse than every cell being slower.
    residency: lazy
    item_block: 8192           # rows per block for catalogue-sized requests
