# Visual extractor configuration.
#
# `extractors_enabled` controls which extractors run in this experiment.
# An empty or absent list = no extractor runs. To disable a model just
# remove it from this list (its definition under `extractors:` stays as
# a catalogue). Valid names: resnet50, vit_b16, cvt_13, coatnet_0,
# levit_256, clip_vitb32, dinov2_vitb14, convnext_base.
extractors_enabled:
  - resnet50
  - vit_b16
  - cvt_13
  - coatnet_0
  - levit_256
  - clip_vitb32
  - dinov2_vitb14
  - convnext_base

extractors:
  # --- Primary (used in fusion) ---
  resnet50:
    model_name: "resnet50"
    weights: "IMAGENET1K_V2"
    raw_dim: 2048
    role: primary

  vit_b16:
    model_name: "vit_base_patch16_224"
    raw_dim: 768
    role: primary

  # --- Architectural hybrids ---
  cvt_13:
    model_name: "cvt_13"
    raw_dim: 384
    role: hybrid

  coatnet_0:
    model_name: "coatnet_0_rw_224"
    raw_dim: 768
    role: hybrid

  levit_256:
    model_name: "levit_256"
    # NOTE: the "256" in the model name is the width of the FIRST stage;
    # the pooled feature is 512-d (validated against a probe forward at
    # extraction time — a mismatch here fails loudly).
    raw_dim: 512
    role: hybrid

  # --- SOTA foundation models ---
  clip_vitb32:
    model_name: "ViT-B-32"
    pretrained: "laion2b_s34b_b79k"
    raw_dim: 512
    role: foundation

  dinov2_vitb14:
    model_name: "dinov2_vitb14"
    raw_dim: 768
    role: foundation

  # --- Modern pure CNN (baseline) ---
  convnext_base:
    model_name: "convnext_base.fb_in22k_ft_in1k"
    raw_dim: 1024
    role: pure_modern

# Primary extractors used in fusion (the rest are standalone baselines)
fusion_extractors:
  - "resnet50"
  - "vit_b16"

# v2: extraction always emits the backbone's NATIVE dimensionality
# (raw_dim above); the learned projection E inside each recommender maps
# it to the common latent dim (common.visual_dim in recommenders.yaml).

# =============================================================================
# Fixed linear projection to a common dimension (optional)
# =============================================================================
# Writes <extractor>_p<dim>.npy next to each native artifact, so every
# extractor also exists in ONE shared dim-dimensional space. The native
# .npy is never touched: both live side by side and can be compared in
# the same battery.
#
# What it buys: the element-wise fusion family (mean/sum/prod/max_pool/
# weighted_mean/...) needs equal dims. Point `fusion_extractors` at the
# projected names and it consumes them directly — no alignment learned
# online, no PCA fit inside the fuse step.
#
#   method: none    - default; extraction emits native dims only (v2).
#           random  - seeded semi-orthogonal matrix (QR of a Gaussian).
#                     Never looks at the data, so it cannot leak val/test
#                     items, is identical across datasets and machines,
#                     and preserves distances approximately (JL).
#           pca     - principal components fit on TRAIN ITEMS ONLY, like
#                     fusion's alignment.method: pca. Keeps more variance,
#                     but is fit per (dataset, artifact) and does not
#                     transfer between them.
#           pca_whitened - pca plus whitening: each component divided by
#                     the sqrt of its train-set variance, so every kept
#                     direction weighs equally in inner products instead
#                     of the first components dominating (Jegou & Chum,
#                     ECCV 2012 - standard for visual descriptors). Same
#                     fit set and leakage guarantees as pca.
#   dim:    target width, shared by every projected artifact. Must not
#           exceed the narrowest enabled backbone's raw_dim (cvt_13 = 384).
#   seed:   used by `random` only; the pca variants are determined by
#           their fit rows.
#
# Any extractor may override the block under `extractors.<name>.projection`
# (e.g. `method: none` to keep one backbone native-only).
#
# The projector itself is written to <extractor>_p<dim>.proj.npz plus a
# .proj.json describing it, so the map is auditable and reproducible.
projection:
  method: none
  dim: 128
  seed: 42

# Batch size for extraction (FP16 allows a larger batch)
batch_size: 256

# Checkpoint every N batches
checkpoint_every: 500
