# Single compose file for every host.  GPU is picked up automatically
# when the host's Docker daemon uses nvidia-container-runtime by default
# (RunPod, lab servers with the toolkit installed).  On hosts without
# it (Mac, Linux without NVIDIA driver, CI runners) the container runs
# on CPU.  The framework's ``device: "auto"`` config resolves to the
# right one at startup; the resolved value is recorded in the manifest.
#
# Usage
# -----
#   docker compose up -d --build           # full pipeline
#   docker compose --profile tools run --rm bootstrap   # download + preprocess only
#   docker compose --profile tools run --rm shell       # interactive shell

services:
  pipeline:
    build: .
    container_name: prism-vrec
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./checkpoints:/app/checkpoints
      - ./plugins:/app/plugins
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./.cache:/app/.cache
    working_dir: /app
    # Run as the host user so everything written through the bind mounts
    # (data/, results/, logs/, checkpoints/) is owned by the researcher
    # instead of root.  Without this the container runs as uid 0 and a
    # bind mount does not translate uids, so every artifact is born
    # root-owned and undeletable without borrowing Docker's root back.
    # Override on a host whose user is not 1000: PRISM_UID=1001 PRISM_GID=1001 docker compose up
    user: "${PRISM_UID:-1000}:${PRISM_GID:-1000}"
    environment:
      # uid 1000 has no /etc/passwd entry inside the image, so HOME would
      # default to / (unwritable).  Every library that caches pretrained
      # weights is pinned to the one path that IS writable.
      HOME: /app/.cache
      XDG_CACHE_HOME: /app/.cache
      TORCH_HOME: /app/.cache/torch
      HF_HOME: /app/.cache/huggingface
      # Full-ranking eval on the large datasets (amazon_women 347k /
      # tradesy 326k items) peaks within ~600 MB of the 16 GB card;
      # expandable segments keep allocator fragmentation from turning
      # those peaks into CUDA OOMs (2026-08-31 crashes).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # One-launch override of resources.gpu.vram_share
      # (configs/resources.yaml): the share of the card the run may
      # claim.  Empty = the YAML value (0.95, for unattended nights);
      # lower it while someone works at the workstation, e.g.
      #   PRISM_VRAM_SHARE=0.5 docker compose up -d
      PRISM_VRAM_SHARE: ${PRISM_VRAM_SHARE:-}
    entrypoint: ["python", "main.py"]
    # Expose the host GPU.  Requires nvidia-container-toolkit on the host
    # (`sudo nvidia-ctk runtime configure --runtime=docker`).  Without the
    # toolkit this reservation makes the failure loud instead of silently
    # falling back to CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: on-failure:3
    shm_size: "4g"
    # Hard cap on container memory.  Without it the container's cgroup is
    # unlimited: a runaway worker pool then exhausts the *host's* RAM and
    # the kernel declares a global OOM, killing the desktop session
    # instead of the run.  The cap is also what lets the in-container
    # sizing heuristics (src/utils/memory.py, src/utils/dataloader.py)
    # read a real budget rather than the host's total RAM.
    #
    # mem_limit / cpus are the only limits that live here, because Docker
    # enforces them.  EVERYTHING ELSE (GPU share, host headroom, worker
    # counts, DataLoader pins, feature residency) is configs/resources.yaml,
    # which the run validates at startup and records in its manifest; a
    # resources.host.budget_bytes above mem_limit is logged as a WARNING.
    #
    # ONE budget, applied to every resource: a run may take half of the
    # machine, never more (resources.gpu.vram_share caps VRAM at the
    # same fraction).  These are caps for the RUN, not for the
    # WORKSTATION: the other half is what lets the researcher keep
    # working across a battery that spans days.  16g and 8 cores are 50%
    # of a 32 GB / 16-core host; override per host, e.g. on a 128 GB lab
    # server:  PRISM_MEM_LIMIT=64g PRISM_CPUS=32 docker compose up -d
    # The 2026-09 65% share (20g / 10.4 cores) still left the desktop
    # swapping once the browser, IDE and other containers were counted.
    # cpu_shares is a *soft* weight (cgroup v2 cpu.weight): under
    # contention the desktop's default weight (1024) wins over the run,
    # while idle cores stay available to it.
    # memswap_limit equal to mem_limit disables swap for the container,
    # so hitting the cap kills one worker instead of thrashing the disk.
    mem_limit: ${PRISM_MEM_LIMIT:-16g}
    memswap_limit: ${PRISM_MEM_LIMIT:-16g}
    cpus: ${PRISM_CPUS:-8}
    cpu_shares: 512
    # Allocate a pseudo-TTY so tqdm renders live in-place progress bars
    # (download, image extraction, feature extraction, evaluation,
    # training). Follow them with a raw stream — ``docker logs -f
    # prism-vrec`` or ``docker attach prism-vrec`` — NOT ``docker compose
    # logs``, whose per-line ``service |`` prefix buffers the ``\r`` the
    # bar uses to redraw in place.
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # One-shot helper to fetch + preprocess amazon_fashion.  Narrows the
  # dataset list to amazon_fashion only via a transient YAML override
  # (configs/default.yaml normally lists all four DVBPR datasets).
  bootstrap:
    build: .
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./.cache:/app/.cache
    working_dir: /app
    # Run as the host user so everything written through the bind mounts
    # (data/, results/, logs/, checkpoints/) is owned by the researcher
    # instead of root.  Without this the container runs as uid 0 and a
    # bind mount does not translate uids, so every artifact is born
    # root-owned and undeletable without borrowing Docker's root back.
    # Override on a host whose user is not 1000: PRISM_UID=1001 PRISM_GID=1001 docker compose up
    user: "${PRISM_UID:-1000}:${PRISM_GID:-1000}"
    environment:
      # uid 1000 has no /etc/passwd entry inside the image, so HOME would
      # default to / (unwritable).  Every library that caches pretrained
      # weights is pinned to the one path that IS writable.
      HOME: /app/.cache
      XDG_CACHE_HOME: /app/.cache
      TORCH_HOME: /app/.cache/torch
      HF_HOME: /app/.cache/huggingface
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        OVERRIDE=configs/zz_bootstrap_override.yaml
        printf 'datasets:\n  - amazon_fashion\n' > "$$OVERRIDE"
        trap 'rm -f "$$OVERRIDE"' EXIT
        python main.py --from download --to preprocess
    shm_size: "2g"
    mem_limit: ${PRISM_MEM_LIMIT:-16g}
    memswap_limit: ${PRISM_MEM_LIMIT:-16g}
    cpus: ${PRISM_CPUS:-8}
    cpu_shares: 512

  shell:
    build: .
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./checkpoints:/app/checkpoints
      - ./plugins:/app/plugins
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./.cache:/app/.cache
    working_dir: /app
    # Run as the host user so everything written through the bind mounts
    # (data/, results/, logs/, checkpoints/) is owned by the researcher
    # instead of root.  Without this the container runs as uid 0 and a
    # bind mount does not translate uids, so every artifact is born
    # root-owned and undeletable without borrowing Docker's root back.
    # Override on a host whose user is not 1000: PRISM_UID=1001 PRISM_GID=1001 docker compose up
    user: "${PRISM_UID:-1000}:${PRISM_GID:-1000}"
    environment:
      # uid 1000 has no /etc/passwd entry inside the image, so HOME would
      # default to / (unwritable).  Every library that caches pretrained
      # weights is pinned to the one path that IS writable.
      HOME: /app/.cache
      XDG_CACHE_HOME: /app/.cache
      TORCH_HOME: /app/.cache/torch
      HF_HOME: /app/.cache/huggingface
      # Same allocator setting as the pipeline service, so manual runs
      # from the shell behave identically.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      PRISM_VRAM_SHARE: ${PRISM_VRAM_SHARE:-}
    entrypoint: ["bash"]
    # Expose the host GPU.  Requires nvidia-container-toolkit on the host
    # (`sudo nvidia-ctk runtime configure --runtime=docker`).  Without the
    # toolkit this reservation makes the failure loud instead of silently
    # falling back to CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    shm_size: "4g"
    mem_limit: ${PRISM_MEM_LIMIT:-16g}
    memswap_limit: ${PRISM_MEM_LIMIT:-16g}
    cpus: ${PRISM_CPUS:-8}
    cpu_shares: 512
